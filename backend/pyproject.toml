[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Backend API for Prelegal legal document SaaS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.1",
    "uvicorn[standard]>=0.40.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
